name: Daily 8AM Cron Job

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily 8 AM Cron Job Started"

      - name: Display Current Date and Time
        run: date

      - name: Display Completion Message
        run: echo "Daily 8 AM Cron Job Completed Successfully"
